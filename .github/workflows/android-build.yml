name: Build HanSub and publish APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: hansub-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled command-line tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check Python server syntax
        run: python -m compileall -q backend
      - name: Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HanSub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HanSub-debug-apk
          path: dist
      - name: Publish public preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp dist/app-debug.apk dist/HanSub-debug.apk
          TAG="v0.3.0-preview"
          if ! gh release view "$TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GH_REPO" \
              --target "$GITHUB_SHA" --title "HanSub v0.3 Preview (Debug APK)" \
              --prerelease \
              --notes "Pre-release Android debug build. Supports Mandarin live subtitles, ML Kit translation, model manager, and optional cloud context mode. Cloud mode requires your own HTTPS backend. Not yet validated on physical devices."
          fi
          gh release upload "$TAG" dist/HanSub-debug.apk --clobber --repo "$GH_REPO"
